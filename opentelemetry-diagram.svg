<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
              refX="10" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
      </marker>
      <pattern id="k8sPattern" patternUnits="userSpaceOnUse" width="4" height="4">
        <rect width="4" height="4" fill="#e8f4f8"/>
        <circle cx="2" cy="2" r="0.5" fill="#326ce5"/>
      </pattern>
    </defs>
    
    <!-- Background -->
    <rect width="1200" height="800" fill="#f8f9fa"/>
    
    <!-- Title -->
    <text x="600" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">
      OpenTelemetry Architecture in Kubernetes
    </text>
    
    <!-- Kubernetes Cluster Container -->
    <rect x="50" y="60" width="900" height="620" fill="url(#k8sPattern)" stroke="#326ce5" stroke-width="3" rx="10"/>
    <text x="70" y="85" font-size="16" font-weight="bold" fill="#326ce5">Kubernetes Cluster</text>
    
    <!-- Application Pod -->
    <rect x="80" y="120" width="280" height="180" fill="#fff" stroke="#4285f4" stroke-width="2" rx="8"/>
    <text x="220" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Application Pod</text>
    
    <!-- Application -->
    <rect x="100" y="160" width="100" height="60" fill="#34a853" stroke="#2d7d32" stroke-width="2" rx="4"/>
    <text x="150" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Application</text>
    <text x="150" y="200" text-anchor="middle" font-size="10" fill="white">+OTel SDK</text>
    
    <!-- Auto-instrumentation -->
    <rect x="220" y="160" width="120" height="60" fill="#ff9800" stroke="#f57c00" stroke-width="2" rx="4"/>
    <text x="280" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Auto-</text>
    <text x="280" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="white">instrumentation</text>
    
    <!-- Sidecar Collector (optional) -->
    <rect x="100" y="240" width="120" height="40" fill="#9c27b0" stroke="#7b1fa2" stroke-width="2" rx="4"/>
    <text x="160" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Sidecar Collector</text>
    
    <!-- Node-level Components -->
    <rect x="80" y="320" width="280" height="140" fill="#f5f5f5" stroke="#757575" stroke-width="2" rx="8"/>
    <text x="220" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Node-level Components</text>
    
    <!-- DaemonSet Collector -->
    <rect x="100" y="360" width="120" height="60" fill="#673ab7" stroke="#512da8" stroke-width="2" rx="4"/>
    <text x="160" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="white">OTel Collector</text>
    <text x="160" y="400" text-anchor="middle" font-size="10" fill="white">(DaemonSet)</text>
    
    <!-- Node Exporter -->
    <rect x="240" y="360" width="100" height="60" fill="#607d8b" stroke="#455a64" stroke-width="2" rx="4"/>
    <text x="290" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Node</text>
    <text x="290" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Exporter</text>
    
    <!-- Central Processing -->
    <rect x="400" y="120" width="260" height="180" fill="#fff" stroke="#ea4335" stroke-width="2" rx="8"/>
    <text x="530" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Central Processing</text>
    
    <!-- Gateway Collector -->
    <rect x="420" y="160" width="120" height="80" fill="#e91e63" stroke="#c2185b" stroke-width="2" rx="4"/>
    <text x="480" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="white">OTel Collector</text>
    <text x="480" y="205" text-anchor="middle" font-size="10" fill="white">(Gateway)</text>
    <text x="480" y="220" text-anchor="middle" font-size="10" fill="white">Deployment</text>
    
    <!-- Operator -->
    <rect x="560" y="160" width="80" height="80" fill="#ff5722" stroke="#d84315" stroke-width="2" rx="4"/>
    <text x="600" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="white">OTel</text>
    <text x="600" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Operator</text>
    
    <!-- Kubernetes API -->
    <rect x="400" y="320" width="260" height="60" fill="#326ce5" stroke="#1565c0" stroke-width="2" rx="8"/>
    <text x="530" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Kubernetes API Server</text>
    
    <!-- Service Mesh (optional) -->
    <rect x="700" y="120" width="220" height="100" fill="#fff" stroke="#795548" stroke-width="2" rx="8"/>
    <text x="810" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Service Mesh (Optional)</text>
    
    <rect x="720" y="160" width="80" height="40" fill="#8bc34a" stroke="#689f38" stroke-width="2" rx="4"/>
    <text x="760" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Istio/Envoy</text>
    
    <rect x="820" y="160" width="80" height="40" fill="#cddc39" stroke="#9e9d24" stroke-width="2" rx="4"/>
    <text x="860" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="black">Linkerd</text>
    
    <!-- Observability Backends -->
    <rect x="980" y="60" width="200" height="620" fill="#fff3e0" stroke="#ff6f00" stroke-width="3" rx="10"/>
    <text x="1080" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#ff6f00">Observability Backends</text>
    
    <!-- Jaeger -->
    <rect x="1000" y="120" width="160" height="60" fill="#00bcd4" stroke="#0097a7" stroke-width="2" rx="4"/>
    <text x="1080" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Jaeger</text>
    <text x="1080" y="160" text-anchor="middle" font-size="10" fill="white">(Tracing)</text>
    
    <!-- Prometheus -->
    <rect x="1000" y="200" width="160" height="60" fill="#ff6b35" stroke="#e53935" stroke-width="2" rx="4"/>
    <text x="1080" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Prometheus</text>
    <text x="1080" y="240" text-anchor="middle" font-size="10" fill="white">(Metrics)</text>
    
    <!-- Grafana -->
    <rect x="1000" y="280" width="160" height="60" fill="#f46800" stroke="#d84315" stroke-width="2" rx="4"/>
    <text x="1080" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Grafana</text>
    <text x="1080" y="320" text-anchor="middle" font-size="10" fill="white">(Visualization)</text>
    
    <!-- Elasticsearch -->
    <rect x="1000" y="360" width="160" height="60" fill="#005571" stroke="#00363d" stroke-width="2" rx="4"/>
    <text x="1080" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Elasticsearch</text>
    <text x="1080" y="400" text-anchor="middle" font-size="10" fill="white">(Logging)</text>
    
    <!-- Commercial Solutions -->
    <rect x="1000" y="440" width="160" height="100" fill="#4caf50" stroke="#388e3c" stroke-width="2" rx="4"/>
    <text x="1080" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Commercial</text>
    <text x="1080" y="480" text-anchor="middle" font-size="10" fill="white">Datadog</text>
    <text x="1080" y="495" text-anchor="middle" font-size="10" fill="white">New Relic</text>
    <text x="1080" y="510" text-anchor="middle" font-size="10" fill="white">Honeycomb</text>
    <text x="1080" y="525" text-anchor="middle" font-size="10" fill="white">etc.</text>
    
    <!-- Data Flow Arrows -->
    <!-- App to Sidecar -->
    <line x1="200" y1="220" x2="160" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- App to DaemonSet -->
    <line x1="150" y1="220" x2="150" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- DaemonSet to Gateway -->
    <line x1="220" y1="390" x2="420" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Sidecar to Gateway -->
    <line x1="220" y1="260" x2="420" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Service Mesh to Gateway -->
    <line x1="700" y1="180" x2="540" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Gateway to Backends -->
    <line x1="540" y1="200" x2="1000" y2="150" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
    <line x1="540" y1="200" x2="1000" y2="230" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
    <line x1="540" y1="200" x2="1000" y2="310" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
    <line x1="540" y1="200" x2="1000" y2="390" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
    <line x1="540" y1="200" x2="1000" y2="490" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
    
    <!-- Operator to K8s API -->
    <line x1="600" y1="240" x2="530" y2="320" stroke="#666" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    
    <!-- Auto-instrumentation connection -->
    <line x1="280" y1="160" x2="150" y2="160" stroke="#ff9800" stroke-width="2" stroke-dasharray="3,3"/>
    
    <!-- Legend -->
    <rect x="80" y="500" width="500" height="160" fill="#f8f9fa" stroke="#ddd" stroke-width="1" rx="5"/>
    <text x="90" y="520" font-size="14" font-weight="bold" fill="#1a1a1a">Legend:</text>
    
    <!-- Legend items -->
    <line x1="100" y1="540" x2="130" y2="540" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="140" y="545" font-size="11" fill="#1a1a1a">Telemetry Data Flow</text>
    
    <line x1="100" y1="560" x2="130" y2="560" stroke="#666" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="140" y="565" font-size="11" fill="#1a1a1a">Control Plane</text>
    
    <line x1="100" y1="580" x2="130" y2="580" stroke="#ff9800" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="140" y="585" font-size="11" fill="#1a1a1a">Instrumentation Injection</text>
    
    <text x="90" y="610" font-size="11" fill="#1a1a1a">• Applications use OTel SDKs or auto-instrumentation</text>
    <text x="90" y="625" font-size="11" fill="#1a1a1a">• Collectors process and forward telemetry data</text>
    <text x="90" y="640" font-size="11" fill="#1a1a1a">• Operator manages collector lifecycle and auto-instrumentation</text>
  </svg>